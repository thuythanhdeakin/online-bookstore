# SonarQube analysis (code HEALTH: smells, duplication, complexity, coverage)
sonar.projectKey=online-bookstore
sonar.projectName=Online Bookstore
sonar.sourceEncoding=UTF-8

sonar.sources=src,public
sonar.tests=tests
sonar.exclusions=**/node_modules/**,public/style.css
# Front-end HTML/JS is covered by smoke tests in deployed envs, not by Jest
sonar.coverage.exclusions=public/**,src/server.js,tests/**
sonar.cpd.exclusions=tests/**,public/**/*.html

# Reports produced earlier in the pipeline
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint.json
