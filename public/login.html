<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Bookstore – Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top pt-navbar">
  <div class="container">
    <a class="navbar-brand pt-brand" href="index.html">Online Bookstore</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="search.html">Search</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="query.html">Query / FAQ</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- PAGE -->
<section class="py-5">
  <div class="container" style="max-width:480px;">
    <h1 class="pt-section-title mb-4 text-center text-uppercase">Login</h1>

    <div id="errorMsg" class="alert alert-danger d-none"></div>

    <div class="pt-form-card">
      <div class="mb-3">
        <label class="form-label">Email address *</label>
        <input type="text" id="email" class="form-control" placeholder="you@example.com" />
      </div>
      <div class="mb-4">
        <label class="form-label">Password *</label>
        <input type="password" id="password" class="form-control" placeholder="Your password" />
      </div>
      <button class="btn pt-btn w-100" onclick="doLogin()">Login</button>
      <p class="text-center small text-muted mt-3">
        Don't have an account? <a href="register.html" class="pt-link">Register here</a>
      </p>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="pt-footer py-4">
  <div class="container">
    <p class="text-center small mb-0">&copy; 2026 Online Bookstore. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Redirect if already logged in
  fetch('/api/me').then(r => r.json()).then(data => {
    if (data.loggedIn) window.location.href = 'index.html';
  });

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.add('d-none');

    if (!email || !password) {
      errorMsg.textContent = 'Please enter your email and password.';
      errorMsg.classList.remove('d-none');
      return;
    }

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.error;
        errorMsg.classList.remove('d-none');
        return;
      }

      window.location.href = 'index.html';
    } catch (err) {
      errorMsg.textContent = 'Something went wrong. Please try again.';
      errorMsg.classList.remove('d-none');
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
