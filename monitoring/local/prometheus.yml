# Prometheus config for running WITHOUT Docker (apps on localhost via pm2)
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - ../alert_rules.yml          # same rules as the Docker setup

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: bookstore-prod
    static_configs:
      - targets: ["localhost:8002"]
        labels: {env: production}
  - job_name: bookstore-staging
    static_configs:
      - targets: ["localhost:8001"]
        labels: {env: staging}
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
