global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Production app (the one we alert on)
  - job_name: bookstore-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["bookstore-production:3000"]
        labels: {env: production}

  # Staging app (monitored for dashboards, alerts are routed as warnings)
  - job_name: bookstore-staging
    metrics_path: /metrics
    static_configs:
      - targets: ["bookstore-staging:3000"]
        labels: {env: staging}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
