# Jenkins Configuration-as-Code: admin user, credentials and SonarQube server
# are all created automatically at startup from environment variables (.env).
jenkins:
  systemMessage: "Online Bookstore CI/CD - configured by JCasC"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube analysis token"
              secret: "${SONAR_TOKEN}"
          - string:
              scope: GLOBAL
              id: "prod-session-secret"
              description: "express-session secret for production"
              secret: "${PROD_SESSION_SECRET}"
          - string:
              scope: GLOBAL
              id: "staging-session-secret"
              description: "express-session secret for staging"
              secret: "${STAGING_SESSION_SECRET}"

unclassified:
  location:
    url: "http://localhost:8080/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
